name: CMake Windows Build

on: [push, pull_request, workflow_dispatch]

env:
  BUILD_TYPE: Release

jobs:
  fetch-mod:
    # MRMP.zip sale de la pre-release rodante ci-latest de Cache180/mr-mp (la publica
    # package.yml en cada push verde). El token por defecto no puede leer artefactos
    # de otro repositorio, asi que se baja por URL publica y se verifica el sha256.
    runs-on: ubuntu-latest
    steps:
      - name: Download MRMP.zip and verify its sha256
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/Cache180/mr-mp/releases/download/ci-latest
          mkdir mrmp
          cd mrmp
          curl --fail --silent --show-error --location --retry 3 -o MRMP.zip "$base/MRMP.zip"
          curl --fail --silent --show-error --location --retry 3 -o MRMP.zip.sha256 "$base/MRMP.zip.sha256"
          sha256sum -c MRMP.zip.sha256
          ls -l

      - name: Keep MRMP.zip for the build job
        uses: actions/upload-artifact@v4
        with:
          name: mrmp-zip
          path: |
            mrmp/MRMP.zip
            mrmp/MRMP.zip.sha256
          if-no-files-found: error

  windows-build:
    needs: fetch-mod
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2
        with:
            submodules: 'true'

      - name: Restore artifacts, or run vcpkg, build and cache artifacts
        uses: lukka/run-vcpkg@v7
        id: runvcpkg
        with:
            vcpkgArguments: 'discord-rpc zlib nlohmann-json openssl cpp-httplib[openssl]'
            vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
            vcpkgGitCommitId: 'b5d1a94fb7f88fd835e360fd23a45a09ceedbf48'
            vcpkgTriplet: 'x64-windows-static'

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build-windows

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build-windows
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_TOOLCHAIN_FILE='${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake' -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build launcher
        working-directory: ${{github.workspace}}/build-windows
        shell: bash
        run: cmake --build . --config $BUILD_TYPE --target Launcher

      - name: Build tests
        working-directory: ${{github.workspace}}/build-windows
        shell: bash
        run: cmake --build . --config $BUILD_TYPE --target MR-Launcher-tests

      - name: Run tests
        working-directory: ${{github.workspace}}/build-windows
        shell: bash
        run: ./Release/MR-Launcher-tests.exe

      - name: Static check - MR-Launcher.exe has no BeamMP hosts
        shell: bash
        run: |
          python -I .github/scripts/check_exe_strings.py \
            "${{github.workspace}}/build-windows/Release/MR-Launcher.exe" \
            --forbid beammp.com beammp.gg \
            --require muertazosracing.com

      - name: Download MRMP.zip
        uses: actions/download-artifact@v4
        with:
          name: mrmp-zip
          path: ${{github.workspace}}/mod

      - name: Package MR-Launcher.exe and MRMP.zip
        shell: bash
        run: |
          set -euo pipefail
          (cd mod && sha256sum -c MRMP.zip.sha256)
          mkdir dist
          cp build-windows/Release/MR-Launcher.exe dist/
          cp mod/MRMP.zip dist/
          ls -l dist

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MR-Launcher
          path: ${{github.workspace}}/dist/
          if-no-files-found: error
